---
# Publish a GitHub release when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches lib/version.sh
        run: |
          source lib/version.sh
          if [[ "${GITHUB_REF_NAME}" != "v${ZAPZ_VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match ZAPZ_VERSION=${ZAPZ_VERSION} in lib/version.sh"
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: install.sh
